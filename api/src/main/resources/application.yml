server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clothmap}
    username: ${DB_USER:clothmap}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  photo-storage-dir: ${PHOTO_STORAGE_DIR:./data/photos}
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  anonymous-secret: ${ANON_SIGNING_SECRET:}
